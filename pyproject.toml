[project]
name = "jai-personas-contrib"
version = "0.1.0"
description = "Enhancing Jupyter AI with Personas"
readme = "README.md"
authors = [
    { name = "Joseph C Wang", email = "joequant@gmail.com" }
]
requires-python = ">=3.12"

dependencies = [
    "jupyter_ai"
]

[project.optional-dependencies]
hermes_agent = [
    "jupyter-ai-jupyternaut>=0.1.0"
]

openclaw = [
    "jupyter-ai-jupyternaut>=0.1.0"
]

openpibot = [
    "jupyter-ai-jupyternaut>=0.1.0"
]

pi = [
    "jupyter-ai-acp-client>=0.3.1"
]

all = ["jai-personas-contrib[hermes_agent,openclaw,pi,openpibot]"]

[tool.black]
target-version = ["py312"]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "G", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.entry-points."jupyter_ai.personas"]
hermes_agent_persona = "jai_personas_contrib.hermes_agent:HermesAgentPersona"
openclaw_persona = "jai_personas_contrib.openclaw:OpenclawPersona"
pi_persona = "jai_personas_contrib.pi:PiAcpPersona"
openpibot_persona = "jai_personas_contrib.openpibot:OpenpibotPersona"
